name: Release

# Publishes a GitHub release with the matching patch from releases/ attached: run it by hand with a tag name like
# kokiri-test1 (the tag is created on the chosen branch), or push that tag.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; releases/fish-oot-<tag>.bps must exist (fish-oot-<tag>-*.bps are attached too)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          patch="releases/fish-oot-${TAG}.bps"
          if [ ! -f "$patch" ]; then
            echo "No $patch for tag $TAG"
            exit 1
          fi
          notes="releases/notes-${TAG}.md"
          if [ ! -f "$notes" ]; then
            notes=releases/README.md
          fi
          # extra patches for the same release, e.g. releases/fish-oot-<tag>-testmode.bps
          extra=$(ls releases/fish-oot-${TAG}-*.bps 2>/dev/null || true)
          gh release create "$TAG" "$patch" $extra \
            --title "fish-oot $TAG" \
            --notes-file "$notes" \
            --target "$TARGET" \
            --prerelease
